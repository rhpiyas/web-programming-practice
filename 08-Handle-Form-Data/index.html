<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>

    <h1 class="title">Student Data Management System</h1>
    <hr><br>

    <form action="http://localhost:3000/register" method="POST"> 
        <label for="name">Enter your name : </label>
        <input type="text" name="Name">

        <br><br>

        <label for="id">Enter Student ID : </label>
        <input type="text" name="ID">

        <br><br>

        <label for="address">Enter Address : </label>
        <input type="text" name="Address">

        <br><br>

        <label for="dept">Select your Department : </label>
        <select name="Department">
            <option selected value="Software Engineering">SWE</option>
            <option value="Computer Science and Engineering">CSE</option>
            <option value="Electronics and Electrical Engineering">EEE</option>
        </select>

        <br><br>

        <button type="submit">Submit</button>
    </form>
    
</body>
</html>
